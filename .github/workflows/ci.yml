name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git cmake python ttf-dejavu ttf-liberation adobe-source-sans-fonts poppler libjpeg-turbo dbus libxkbcommon weston sway strace
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        run: cmake --preset linux-release && cmake --build --preset linux-release --parallel 4 && ctest --preset linux-release
      - name: Sanitizers
        run: cmake --preset linux-asan && cmake --build --preset linux-asan --parallel 4 && ctest --preset linux-asan -R "rayomd-gui-unit|rayomd-gui-wayland-weston"
      - name: Dynamic section (libc only)
        run: |
          readelf -d build/linux-release/src/rayomd-gui
          needed=$(readelf -d build/linux-release/src/rayomd-gui | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
          test "$needed" = "ld-linux-x86-64.so.2 libc.so.6 " || { echo "unexpected NEEDED entries: $needed"; exit 1; }
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: |
            build/linux-release/e2e/weston/out.png
            build/linux-release/e2e/sway/out.png
            build/linux-asan/e2e/weston/out.png
          if-no-files-found: warn

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
      - name: Build and test
        run: cmake --preset windows-mingw && cmake --build --preset windows-mingw --parallel 4 && build/windows/tests/rayomd-gui-tests.exe
