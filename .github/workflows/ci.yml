name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git cmake python ttf-dejavu ttf-liberation adobe-source-sans-fonts poppler libjpeg-turbo dbus libxkbcommon weston sway strace
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test
        run: cmake --preset linux-release && cmake --build --preset linux-release --parallel 4 && ctest --preset linux-release
      - name: Sanitizers
        run: cmake --preset linux-asan && cmake --build --preset linux-asan --parallel 4 && ctest --preset linux-asan -R "rayomd-gui-unit|rayomd-gui-wayland-weston"
      - name: Exploit mitigations and libc only
        run: tests/check_hardening.sh linux build/linux-release/src/rayomd-gui
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: |
            build/linux-release/e2e/weston/out.png
            build/linux-release/e2e/sway/out.png
            build/linux-asan/e2e/weston/out.png
          if-no-files-found: warn

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
      - name: Build and test
        run: cmake --preset windows-mingw && cmake --build --preset windows-mingw --parallel 4 && build/windows/tests/rayomd-gui-tests.exe
      - name: Exploit mitigations and delay-loaded DLLs
        run: tests/check_hardening.sh windows build/windows/src/rayomd-gui.exe
      - name: Snapshot
        run: |
          appdata="$(mktemp -d)"
          mkdir -p "$appdata/RayoMD"
          printf 'ui.theme=tokyo-night\n' > "$appdata/RayoMD/rayomd-gui.ini"
          # Redirected output: the GUI-subsystem exe writes to the pipes, and the shell waits for it.
          # Twice: the first start reads the fonts cold, the second shows the warm start.
          APPDATA="$(cygpath -w "$appdata")" build/windows/src/rayomd-gui.exe --snapshot snapshot.png external/rayomd/tester.md 2>&1 | cat
          test "${PIPESTATUS[0]}" -eq 0
          APPDATA="$(cygpath -w "$appdata")" build/windows/src/rayomd-gui.exe --snapshot snapshot.png external/rayomd/tester.md 2>&1 | cat
          test "${PIPESTATUS[0]}" -eq 0
          python tests/e2e/check_snapshot.py snapshot.png 1a1b26 7aa2f7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-windows
          path: snapshot.png

  fuzz:
    name: Fuzz (libFuzzer, 60 s per harness)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install packages
        run: pacman -Syu --noconfirm --needed base-devel git cmake clang compiler-rt python ttf-dejavu adobe-source-sans-fonts
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: cmake --preset linux-fuzz && cmake --build --preset linux-fuzz --parallel 4
      - name: Fuzz
        env:
          RAYOMD_FONT: /usr/share/fonts/TTF/DejaVuSans.ttf
        run: tests/fuzz/run_fuzzers.sh build/linux-fuzz 60 build/fuzz-work
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            build/fuzz-work/artifacts
            build/fuzz-work/logs
          if-no-files-found: ignore
